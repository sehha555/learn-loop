name: LearnLoop
options:
  bundleIdPrefix: com.sehha555
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # 免費 Apple ID 簽章：Xcode 自動管理，不指定 team
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "2" # 只做 iPad

targets:
  LearnLoop:
    type: application
    platform: iOS
    sources:
      - LearnLoop
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sehha555.learnloop
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: ShareExtension
        embed: true

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: LearnLoop
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sehha555.learnloop.share
