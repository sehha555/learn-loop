name: LearnLoop
options:
  bundleIdPrefix: com.sehha555
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # 免費 Apple ID 的 Personal Team。裝進自己的 iPad 夠用，
    # 但拿不到 App Group（那要付費開發者帳號），所以主 app 和分享浮層
    # 目前各存各的樹 —— 見 CardStore.isShared
    DEVELOPMENT_TEAM: SBQBLH3786
    TARGETED_DEVICE_FAMILY: "2" # 只做 iPad

packages:
  # 離線渲染 LaTeX 數學式。Shared/ 兩個 target 共用，所以兩邊都要連
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    from: "1.7.3"

targets:
  LearnLoop:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - LearnLoopTests
    sources:
      - LearnLoop
      - Shared
    info:
      path: LearnLoop/Info.plist
      properties:
        CFBundleDisplayName: LearnLoop
        UILaunchScreen: {}
        # Mac 中繼站走 http（區網 / Tailscale 內網），iOS 預設只准 https，要開例外；
        # 連區網另外要本地網路權限，第一次連會跳系統詢問
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: 連你自己 Mac 上的中繼站，用 Claude Code 處理截圖。
        # 四個方向都要支援，iPad 多工（Slide Over / 並排視窗）才會開放給這個 app
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sehha555.learnloop
    dependencies:
      - target: ShareExtension
        embed: true
      - package: SwiftMath

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: LearnLoop
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sehha555.learnloop.share
    dependencies:
      - package: SwiftMath

  # 純邏輯的單元測試（ConceptLogic）。跑法：
  # xcodebuild test -project LearnLoop.xcodeproj -scheme LearnLoop -destination 'platform=iOS Simulator,name=iPad Pro 11-inch (M5)'
  LearnLoopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LearnLoopTests
    dependencies:
      - target: LearnLoop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sehha555.learnloop.tests
        GENERATE_INFOPLIST_FILE: YES
