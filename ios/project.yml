name: LearnLoop
options:
  bundleIdPrefix: com.sehha555
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # 免費 Apple ID 的 Personal Team。裝進自己的 iPad 夠用，
    # 但拿不到 App Group（那要付費開發者帳號），所以主 app 和分享浮層
    # 目前各存各的樹 —— 見 CardStore.isShared
    DEVELOPMENT_TEAM: SBQBLH3786
    TARGETED_DEVICE_FAMILY: "2" # 只做 iPad

targets:
  LearnLoop:
    type: application
    platform: iOS
    sources:
      - LearnLoop
      - Shared
    info:
      path: LearnLoop/Info.plist
      properties:
        CFBundleDisplayName: LearnLoop
        UILaunchScreen: {}
        # 四個方向都要支援，iPad 多工（Slide Over / 並排視窗）才會開放給這個 app
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sehha555.learnloop
    dependencies:
      - target: ShareExtension
        embed: true

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: LearnLoop
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sehha555.learnloop.share
